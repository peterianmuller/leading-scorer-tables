<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leading Scorer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Leading Scorer</h1>
      <form id="game-form">
        <label>
          Game ID
          <input id="game-id" name="gameId" placeholder="0022500002" pattern="\d{10}" />
        </label>
        <button type="submit">Load</button>
      </form>
      <p id="matchup" class="muted"></p>
    </header>

    <section id="player" hidden>
      <h2 id="player-name"></h2>
      <p id="player-meta" class="muted"></p>
      <div class="table-wrap">
        <table id="stats">
          <thead><tr><th>Stat</th><th>Value</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <p id="status" class="muted">Loading…</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
