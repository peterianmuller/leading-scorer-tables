<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leading Scorers</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Leading Scorers</h1>

      <div class="controls">
        <label>
          Season
          <select id="season"></select>
        </label>
        <label>
          Date
          <select id="date"></select>
        </label>
      </div>

      <div id="games" class="games"></div>

      <details id="manual">
        <summary>Load by game ID</summary>
        <form id="game-form">
          <label>
            Game ID
            <input id="game-id" name="gameId" placeholder="0022500002" pattern="\d{10}" />
          </label>
          <button type="submit">Load</button>
        </form>
      </details>

      <p id="matchup" class="muted"></p>
    </header>

    <section id="teams" hidden></section>

    <p id="status" class="muted">Loading…</p>
  </main>

  <!-- One card per team; both are filled from the same shape, so the markup
       lives here once rather than twice in app.js. -->
  <template id="team-card">
    <article class="team">
      <p class="team-name muted"></p>
      <h2 class="player-name"></h2>
      <p class="player-meta muted"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Stat</th><th>Value</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
